services:
  - type: web
    name: gestor-tecnologia-api
    runtime: docker
    rootDir: api
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MYSQL_SSL
        value: true
      - key: MYSQL_SSL_REJECT_UNAUTHORIZED
        value: false
      - key: AUTO_INIT_DB
        value: true
      - key: SEED_INITIAL_DATA
        value: true
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: gestor-tecnologia-web
    runtime: docker
    rootDir: web
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false
