services:
  api:
    build:
      context: ./api
    container_name: gestor-api
    ports:
      - '4000:4000'
    environment:
      - PORT=4000
      - JWT_SECRET=demo-secret-local
      - CORS_ORIGIN=http://localhost:5173
      - DATABASE_URL=${DATABASE_URL}
      - MYSQL_SSL=${MYSQL_SSL:-true}
      - MYSQL_SSL_REJECT_UNAUTHORIZED=${MYSQL_SSL_REJECT_UNAUTHORIZED:-false}
      - AUTO_INIT_DB=true
      - SEED_INITIAL_DATA=true

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:4000
    container_name: gestor-web
    ports:
      - '5173:80'
    depends_on:
      - api
